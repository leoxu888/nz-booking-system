<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Book an appointment</title>
  <!-- 绝对路径：无论页面在 / 还是 /book/{slug} 都能正确加载本地 Vue -->
  <script src="/vendor/vue.global.prod.js"></script>
  <style>
    :root {
      --blue: #0071e3;
      --blue-press: #005bbd;
      --ink: #1d1d1f;
      --sub: #6e6e73;
      --bg: #f5f5f7;
      --card: #ffffff;
      --line: #e6e6ea;
      --green: #1faa59;
      --red: #d23b3b;
      --radius: 18px;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
             "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 18px 56px; }

    .hero { text-align: center; margin-bottom: 22px; }
    .hero h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em;
               margin: 0 0 6px; font-weight: 700; }
    .hero p { color: var(--sub); margin: 0; font-size: 15px; }
    .steps { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
    .stepdot { width: 26px; height: 4px; border-radius: 4px; background: var(--line);
               transition: background .3s ease; }
    .stepdot.on { background: var(--blue); }

    .card { background: var(--card); border-radius: var(--radius); padding: 18px;
            margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04),
            0 8px 24px rgba(20,30,60,.06); }

    .label { font-size: 13px; font-weight: 600; color: var(--sub);
             text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }

    .opt { display: flex; align-items: center; justify-content: space-between;
           width: 100%; text-align: left; border: 1.5px solid var(--line);
           background: #fbfbfd; border-radius: 14px; padding: 16px;
           margin: 8px 0; cursor: pointer; transition: transform .12s ease,
           border-color .2s ease, background .2s; }
    .opt:active { transform: scale(.97); }
    .opt.sel { border-color: var(--blue); background: #eff5ff; }
    .opt .name { font-size: 17px; font-weight: 600; }
    .opt .meta { color: var(--sub); font-size: 13px; margin-top: 2px; }
    .opt .price { font-size: 17px; font-weight: 600; white-space: nowrap; }
    .opt .tick { color: var(--blue); font-weight: 700; margin-left: 8px; }

    .daterow { display: flex; align-items: center; gap: 12px; }
    .navbtn { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%;
              border: 1.5px solid var(--line); background: #fff; font-size: 20px;
              cursor: pointer; transition: transform .12s ease, background .2s; }
    .navbtn:active { transform: scale(.92); }
    .datepill { flex: 1; text-align: center; }
    .datepill .d1 { font-size: 18px; font-weight: 600; }
    .datepill .d2 { font-size: 13px; color: var(--sub); }

    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
             margin-top: 14px; }
    .slot { border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
            padding: 13px 0; text-align: center; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: transform .12s ease, border-color .2s,
            background .2s; }
    .slot:active { transform: scale(.95); }
    .slot.sel { border-color: var(--blue); background: #eff5ff; color: var(--blue); }
    .slot.disabled { color: #c7c7cc; background: #fafafa; border-color: #f0f0f3;
                     cursor: not-allowed; }
    .empty { color: var(--sub); text-align: center; padding: 18px 0; font-size: 15px; }

    input[type=tel], input[type=text] { width: 100%; padding: 15px; font-size: 18px;
            letter-spacing: .01em; border: 1.5px solid var(--line); border-radius: 14px;
            margin-top: 6px; background: #fbfbfd; transition: border-color .2s; }
    input:focus { outline: none; border-color: var(--blue); }
    .preview { margin-top: 8px; font-size: 15px; color: var(--ink); }
    .preview b { color: var(--green); }
    .hint { margin-top: 6px; font-size: 13px; color: var(--sub); }

    .btn { display: block; width: 100%; border: none; background: var(--blue);
           color: #fff; font-size: 17px; font-weight: 600; padding: 16px;
           border-radius: 14px; margin-top: 14px; cursor: pointer;
           transition: transform .12s ease, background .2s, opacity .2s; }
    .btn:active { transform: scale(.98); background: var(--blue-press); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.ghost { background: #ececf0; color: var(--ink); }
    .btn.ghost:active { background: #e0e0e5; }

    .err { color: var(--red); font-size: 14px; margin-top: 10px; }

    .ok { text-align: center; padding: 8px 4px 4px; }
    .checkcircle { width: 76px; height: 76px; border-radius: 50%; background: #eafaf0;
                   color: var(--green); display: flex; align-items: center;
                   justify-content: center; font-size: 40px; margin: 6px auto 14px;
                   animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .ok h2 { font-size: 24px; letter-spacing: -0.01em; margin: 0 0 4px; }
    .detail { background: #fbfbfd; border: 1px solid var(--line); border-radius: 14px;
              padding: 14px; margin: 16px 0; text-align: left; }
    .detail .row { display: flex; justify-content: space-between; padding: 6px 0; }
    .detail .row span:first-child { color: var(--sub); }
    .detail .row span:last-child { font-weight: 600; }
    a.cal { display: block; text-decoration: none; color: var(--blue);
            font-weight: 600; font-size: 16px; margin: 4px 0; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid
               rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%;
               animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-enter-active, .step-leave-active { transition: all .28s cubic-bezier(.3,.8,.3,1); }
    .step-enter-from { opacity: 0; transform: translateY(10px); }
    .step-leave-to { opacity: 0; transform: translateY(-10px); }

    .codecard { text-align: center; }
    .codecard input { text-align: center; font-size: 20px; letter-spacing: .05em; }

    @media (prefers-reduced-motion: reduce) {
      .step-enter-active, .step-leave-active { transition: opacity .2s ease; }
      .step-enter-from, .step-leave-to { transform: none; }
      .checkcircle { animation: none; }
      .opt, .slot, .btn, .navbtn { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <!-- 没有 slug：让顾客输入店铺预约码 -->
    <div v-if="!slug" class="card codecard">
      <h1 style="font-size:26px;margin:0 0 6px">Enter booking code</h1>
      <p class="hint">例如 <b>demo</b> —— 由你的店家提供。</p>
      <input type="text" v-model="codeInput" placeholder="shop code"
             @keyup.enter="goCode" />
      <button class="btn" :disabled="!codeInput.trim()" @click="goCode">Go</button>
      <div class="err" v-if="codeErr">{{ codeErr }}</div>
    </div>

    <template v-else>
      <div class="hero">
        <h1>{{ shop.name || 'Book an appointment' }}</h1>
        <p>Pick a service &middot; choose a time &middot; we'll free-remind you</p>
        <div class="steps">
          <div class="stepdot" :class="{on: ['time','details','done'].includes(step)}"></div>
          <div class="stepdot" :class="{on: ['details','done'].includes(step)}"></div>
          <div class="stepdot" :class="{on: step==='done'}"></div>
        </div>
      </div>

      <transition name="step" mode="out-in">
        <!-- STEP 1: service -->
        <div v-if="step==='service'" key="service">
          <div class="card">
            <p class="label">Choose a service</p>
            <button v-for="s in services" :key="s.id" class="opt"
                    :class="{sel: selectedService===s.id}" @click="chooseService(s.id)">
              <span>
                <span class="name">{{ s.name }}</span>
                <span class="meta">{{ s.duration_min }} min</span>
              </span>
              <span>
                <span class="price">${{ s.price }}</span>
                <span class="tick" v-if="selectedService===s.id">✓</span>
              </span>
            </button>
            <div v-if="services.length===0" class="empty">This shop has no services yet.</div>
          </div>
          <button class="btn" :disabled="!selectedService" @click="loadSlots">Next: pick a time</button>
        </div>

        <!-- STEP 2: time -->
        <div v-else-if="step==='time'" key="time">
          <div class="card">
            <p class="label">Choose a time</p>
            <div class="daterow">
              <button class="navbtn" @click="shiftDay(-1)">‹</button>
              <div class="datepill">
                <div class="d1">{{ prettyDate }}</div>
                <div class="d2">{{ weekday }}</div>
              </div>
              <button class="navbtn" @click="shiftDay(1)">›</button>
            </div>
            <div class="slots">
              <div v-for="sl in slots" :key="sl.start_local" class="slot"
                   :class="{sel: selectedSlot && selectedSlot.start_local===sl.start_local,
                            disabled: sl.disabled}"
                   @click="!sl.disabled && (selectedSlot=sl)">
                {{ sl.label }}
              </div>
            </div>
            <div v-if="slots.length===0" class="empty">No open times this day — try another date.</div>
          </div>
          <button class="btn" :disabled="!selectedSlot" @click="step='details'">Next: your details</button>
          <button class="btn ghost" @click="step='service'">Back</button>
        </div>

        <!-- STEP 3: name + email (replaces old phone step) -->
        <div v-else-if="step==='details'" key="details">
          <div class="card">
            <p class="label">Your details</p>
            <div class="sub" style="color:var(--sub);margin-bottom:6px">
              {{ serviceName }} &middot; {{ slotLabel }}
            </div>
            <input type="text" v-model="custName" placeholder="Your name" />
            <input type="email" v-model="custEmail" placeholder="you@example.com"
                   style="margin-top:10px" />
            <div class="hint">We'll send your confirmation and reminder here (free).</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
              <div class="sub" style="color:var(--sub);margin-bottom:6px">Repeat weekly?</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer">
                <input type="checkbox" v-model="repeatWeekly" style="width:auto;margin:0" />
                <span>Weekly recurring (e.g. piano / PT course)</span>
              </label>
              <div v-if="repeatWeekly" style="display:flex;align-items:center;gap:8px;margin-top:8px">
                <span class="hint" style="margin:0">for</span>
                <input type="number" min="2" max="52" v-model.number="repeatWeeks"
                       style="max-width:80px" />
                <span class="hint" style="margin:0">weeks</span>
              </div>
            </div>
            <div class="err" v-if="detailsErr">{{ detailsErr }}</div>
          </div>
          <button class="btn" :disabled="!detailsValid || loading" @click="confirm">
            <span v-if="loading"><span class="spinner"></span>Booking…</span>
            <span v-else>Confirm booking</span>
          </button>
          <button class="btn ghost" :disabled="loading" @click="step='time'">Back</button>
        </div>

        <!-- STEP 4: done -->
        <div v-else-if="step==='done'" key="done">
          <div class="card ok">
            <div class="checkcircle">✓</div>
            <h2>You're booked!</h2>
            <p style="color:var(--sub);margin:0">A confirmation is on its way to {{ custEmail }}.</p>
            <div class="detail">
              <div class="row"><span>Service</span><span>{{ serviceName }}</span></div>
              <div class="row"><span>When</span><span>{{ prettyDate }} · {{ slotLabel }}</span></div>
              <div class="row"><span>Name</span><span>{{ custName }}</span></div>
              <div class="row"><span>Email</span><span>{{ custEmail }}</span></div>
            </div>
            <div v-if="result.series && result.series.length > 1" class="detail">
              <div class="row"><span>You're booked for</span><span>{{ result.series.length }} sessions</span></div>
              <div class="row" v-for="(it, i) in result.series" :key="it.id">
                <span>{{ i + 1 }}. {{ fmtSeries(it.start_local) }}</span>
                <a class="cal" :href="it.manage_url" style="margin:0">Manage</a>
              </div>
            </div>
            <a class="cal" :href="'/api/book/'+slug+'/booking/'+result.id+'/ics'">⬇ Add to Apple / Outlook calendar</a>
            <a class="cal" :href="googleCalUrl" target="_blank">➕ Add to Google Calendar</a>
            <a class="cal" v-if="result.manage_url" :href="result.manage_url">⚙ Manage this booking</a>
            <button class="btn ghost" @click="reset">Book another</button>
          </div>
        </div>
      </transition>
    </template>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // 从 URL 提取店铺 slug（/book/demo 或 /book/demo/）
    function getSlug() {
      const m = location.pathname.match(/\/book\/([\w-]+)/);
      return m ? m[1] : '';
    }

    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    createApp({
      setup() {
        const slug = ref(getSlug());
        const codeInput = ref('');
        const codeErr = ref('');
        const shop = ref({ name: '' });
        const services = ref([]);
        const step = ref('service');
        const selectedService = ref(null);
        const dateObj = ref(new Date());
        const slots = ref([]);
        const selectedSlot = ref(null);
        const custName = ref('');
        const custEmail = ref('');
        const detailsErr = ref('');
        const loading = ref(false);
        const result = ref(null);
        const repeatWeekly = ref(false);
        const repeatWeeks = ref(8);

        const base = computed(() => slug.value ? `/api/book/${slug.value}` : '');

        function goCode() {
          const c = codeInput.value.trim().toLowerCase();
          if (!c) return;
          location.href = '/book/' + c;
        }

        async function loadShop() {
          if (!slug.value) return;
          try { shop.value = await (await fetch(base.value + '/shop')).json(); } catch (e) {}
        }
        async function loadServices() {
          if (!slug.value) return;
          services.value = await (await fetch(base.value + '/services')).json();
        }
        function chooseService(id) { selectedService.value = id; }

        const prettyDate = computed(() =>
          dateObj.value.toLocaleDateString('en-NZ', { day: 'numeric', month: 'long' }));
        const weekday = computed(() =>
          dateObj.value.toLocaleDateString('en-NZ', { weekday: 'long', year: 'numeric' }));

        async function loadSlots() {
          const ds = localDateStr(dateObj.value);
          const r = await fetch(`${base.value}/availability?service_id=${selectedService.value}&date=${ds}`);
          const data = await r.json();
          const now = Date.now();
          slots.value = data.map(s => {
            const t = new Date(s.start_local).getTime();
            return { ...s, disabled: t <= now };
          });
          selectedSlot.value = null;
          step.value = 'time';
        }
        function shiftDay(delta) {
          const d = new Date(dateObj.value);
          d.setDate(d.getDate() + delta);
          dateObj.value = d;
          loadSlots();
        }

        const serviceName = computed(() => {
          const s = services.value.find(x => x.id === selectedService.value);
          return s ? s.name : '';
        });
        const slotLabel = computed(() => selectedSlot.value ? selectedSlot.value.label : '');

        // ---- customer details validation ----
        const emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
        const detailsValid = computed(() =>
          custName.value.trim().length > 0 && emailRe.test(custEmail.value.trim()));

        // Google Calendar 一键添加链接（基于预约结果的时间 + 真实服务时长）
        const googleCalUrl = computed(() => {
          if (!result.value) return '#';
          const start = new Date(result.value.start_local);
          const svc = services.value.find(x => x.id === selectedService.value);
          const minutes = svc ? svc.duration_min : 30;
          const end = new Date(start.getTime() + minutes * 60000); // 用真实时长，避免结束时间错位
          const fmt = d => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
          const params = new URLSearchParams({
            action: 'TEMPLATE',
            text: serviceName.value,
            dates: `${fmt(start)}/${fmt(end)}`,
            details: `Booking at ${shop.value.name || 'the shop'}`,
          });
          return `https://calendar.google.com/calendar/render?${params.toString()}`;
        });

        async function confirm() {
          if (!detailsValid.value) {
            detailsErr.value = 'Please enter your name and a valid email.';
            return;
          }
          loading.value = true;
          try {
            const r = await fetch(base.value + '/bookings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                service_id: selectedService.value,
                start_local: selectedSlot.value.start_local,
                customer_name: custName.value.trim(),
                customer_email: custEmail.value.trim().toLowerCase(),
                repeat_weeks: repeatWeekly.value ? Math.max(2, repeatWeeks.value || 2) : 1,
              })
            });
            if (r.ok) { result.value = await r.json(); step.value = 'done'; }
            else { detailsErr.value = 'That slot was just taken — pick another.'; loadSlots(); }
          } catch (e) {
            detailsErr.value = 'Network error — please try again.';
          } finally { loading.value = false; }
        }
        function fmtSeries(iso) {
          const d = new Date(iso);
          if (isNaN(d)) return iso;
          return d.toLocaleString('en-NZ', { weekday: 'short', day: 'numeric',
            month: 'short', hour: '2-digit', minute: '2-digit' });
        }
        function reset() {
          selectedService.value = null; selectedSlot.value = null;
          custName.value = ''; custEmail.value = ''; detailsErr.value = '';
          step.value = 'service'; loadServices();
        }

        onMounted(() => { loadShop(); loadServices(); });
        return { slug, codeInput, codeErr, goCode, shop, services, step, selectedService,
                 prettyDate, weekday, slots, selectedSlot, custName, custEmail, detailsErr,
                 loading, result, serviceName, slotLabel, chooseService, loadSlots, shiftDay,
                 detailsValid, googleCalUrl, confirm, reset, repeatWeekly, repeatWeeks,
                 fmtSeries };
      }
    }).mount('#app');
  </script>
</body>
</html>
